name: Python 3.14 cleanup

on:
  push:
    branches:
      - work/beta2-phase1
    paths:
      - .github/workflows/python314-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/beta2-phase1
          fetch-depth: 0
      - name: Remove obsolete future annotations and align Ruff
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(
              ["git", "ls-files", "*.py"], text=True
          ).splitlines()
          future_line = "from __future__ import annotations"
          changed = []
          for raw_path in paths:
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)
              if lines and lines[0].rstrip("\r\n") == future_line:
                  lines.pop(0)
                  if lines and not lines[0].strip():
                      lines.pop(0)
                  path.write_text("".join(lines), encoding="utf-8")
                  changed.append(raw_path)

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          old = 'target-version = "py313"'
          new = 'target-version = "py314"'
          if old not in text and new not in text:
              raise SystemExit("Ruff target-version setting not found")
          if old in text:
              pyproject.write_text(text.replace(old, new, 1), encoding="utf-8")

          remaining = []
          for raw_path in paths:
              if future_line in Path(raw_path).read_text(encoding="utf-8"):
                  remaining.append(raw_path)
          if remaining:
              raise SystemExit(f"Future annotations import remains in: {remaining}")

          print(f"Removed future annotations import from {len(changed)} files")
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py' pyproject.toml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Target Python 3.14 annotation semantics"
            git push origin HEAD:work/beta2-phase1
          fi
