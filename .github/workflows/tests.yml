name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.10"
            requirements: requirements-test-2026.10.txt
          - home-assistant: "2026.11"
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.requirements }}"
      - name: Compile integration
        run: python -m compileall -q custom_components/ovum_mira
      - name: Run tests with coverage
        run: python -m pytest -q --cov=custom_components.ovum_mira --cov-report=term-missing
      - name: Run Ruff
        run: ruff check .
